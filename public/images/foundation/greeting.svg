<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Minh họa tình huống chào hỏi tiếng Trung: Nǐ hǎo (Xin chào)">
  <rect width="480" height="260" rx="14" fill="#EFF6FF"/>
  <rect x="20" y="200" width="440" height="40" rx="8" fill="#DBEAFE"/>
  <!-- Person A -->
  <circle cx="145" cy="96" r="28" fill="#FDBA74"/>
  <path d="M108 195 C108 145 182 145 182 195 Z" fill="#2563EB"/>
  <!-- Person B -->
  <circle cx="335" cy="96" r="28" fill="#FED7AA"/>
  <path d="M298 195 C298 145 372 145 372 195 Z" fill="#0D9488"/>
  <!-- Speech Bubble A -->
  <rect x="65" y="22" width="160" height="44" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="145" y="43" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0F172A">你好！ (Nǐ hǎo!)</text>
  <text x="145" y="59" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Xin chào!</text>
  <!-- Speech Bubble B -->
  <rect x="255" y="22" width="170" height="44" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="340" y="43" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0F172A">你好！ (Nǐ hǎo!)</text>
  <text x="340" y="59" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">Chào bạn!</text>
  <!-- Footer Educational Label -->
  <text x="240" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#1E3A8A">Bối cảnh chào hỏi trực tiếp — Biến điệu thanh 3: đọc ní hǎo</text>
</svg>
