<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Minh họa gia đình 4 người: Wǒ jiā yǒu sì kǒu rén">
  <rect width="480" height="260" rx="14" fill="#F0FDF4"/>
  <rect x="20" y="200" width="440" height="40" rx="8" fill="#DCFCE7"/>
  <!-- 4 Family members -->
  <g>
    <circle cx="95" cy="95" r="24" fill="#FDBA74"/>
    <rect x="70" y="126" width="50" height="66" rx="12" fill="#1D4ED8"/>
    <text x="95" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">爸爸</text>
    <text x="95" y="72" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">bàba (Bố)</text>
  </g>
  <g>
    <circle cx="195" cy="98" r="23" fill="#FED7AA"/>
    <rect x="171" y="128" width="48" height="64" rx="12" fill="#DB2777"/>
    <text x="195" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">妈妈</text>
    <text x="195" y="72" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">māma (Mẹ)</text>
  </g>
  <g>
    <circle cx="295" cy="112" r="20" fill="#FDBA74"/>
    <rect x="275" y="138" width="40" height="54" rx="10" fill="#059669"/>
    <text x="295" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">我</text>
    <text x="295" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">wǒ (Tôi)</text>
  </g>
  <g>
    <circle cx="385" cy="122" r="17" fill="#FED7AA"/>
    <rect x="368" y="145" width="34" height="47" rx="10" fill="#D97706"/>
    <text x="385" y="88" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">妹妹</text>
    <text x="385" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">mèimei (Em gái)</text>
  </g>
  <text x="240" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#14532D">我家有四口人 (Wǒ jiā yǒu sì kǒu rén) — Nhà tôi có 4 người</text>
</svg>
